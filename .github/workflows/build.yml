name: Build and Release CLI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build CLI for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            go_arch: amd64
          - os: windows
            runner: windows-latest
            go_arch: amd64

    steps:
      - name: Checkout Go CLI
        uses: actions/checkout@v4
        with:
          path: omp-cli

      - name: Checkout Rust Core
        uses: actions/checkout@v4
        with:
          repository: TanF12/omp-launchlib
          path: omp-launchlib

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: omp-cli/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows' && 'i686-pc-windows-msvc,x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu,i686-pc-windows-gnu' }}

      - name: Install MinGW Cross-Compiler (Linux only, for compiling injector)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: omp-launchlib -> target

      - name: Compile Rust Core & Injector (Windows)
        if: matrix.os == 'windows'
        working-directory: omp-launchlib
        run: |
          cargo build --package omp-core --release
          cargo build --package omp-injector --release --target i686-pc-windows-msvc

      - name: Compile Rust Core & Injector (Linux)
        if: matrix.os == 'linux'
        working-directory: omp-launchlib
        run: |
          cargo build --package omp-core --release
          cargo build --package omp-injector --release --target i686-pc-windows-gnu

      - name: Compile Go CLI
        working-directory: omp-cli
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.go_arch }}
          CGO_LDFLAGS: "-L${{ github.workspace }}/omp-launchlib/target/release"
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            go build -ldflags="-s -w" -o target/omp-cli.exe ./cmd/omp-cli
          else
            go build -ldflags="-s -w" -o target/omp-cli ./cmd/omp-cli
          fi

      - name: Package Dist (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p dist-windows
          cp omp-cli/target/omp-cli.exe dist-windows/
          cp omp-launchlib/target/release/omp_core.dll dist-windows/
          cp omp-launchlib/target/i686-pc-windows-msvc/release/omp-injector.exe dist-windows/
          cd dist-windows && 7z a ../omp-cli-windows-amd64.zip *

      - name: Package Dist (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p dist-linux
          cp omp-cli/target/omp-cli dist-linux/
          cp omp-launchlib/target/release/libomp_core.so dist-linux/
          cp omp-launchlib/target/i686-pc-windows-gnu/release/omp-injector.exe dist-linux/
          cd dist-linux && tar -czvf ../omp-cli-linux-amd64.tar.gz *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omp-cli-${{ matrix.os }}
          path: |
            omp-cli-windows-amd64.zip
            omp-cli-linux-amd64.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true